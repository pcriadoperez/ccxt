services:
  order-router:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      ORDER_ROUTER_EXCHANGES: "kraken,coinbase,kucoin,bitget,gate"
      ORDER_ROUTER_SYMBOLS: "BTC/USDT,ETH/USDT"
      ORDER_ROUTER_STALE_BOOK_MS: "5000"
      # Required — no fallback. A default here is a published credential: it reaches the key
      # store through the LEGACY ENV BRIDGE rather than the dev-key path, so it authenticates
      # with none of the warnings the dev fallback prints. Compose fails to start without it.
      ORDER_ROUTER_API_KEY: "${ORDER_ROUTER_API_KEY:?set ORDER_ROUTER_API_KEY}"
      ORDER_ROUTER_RATE_LIMIT_MAX: "600"
    restart: unless-stopped

  order-router-mcp:
    build: .
    command: ["node", "dist/mcp/server.js"]
    ports:
      - "8081:8081"
    environment:
      ORDER_ROUTER_API_URL: "http://order-router:8080"
      ORDER_ROUTER_MCP_PORT: "8081"
      # Must match the router's key: used both to authenticate MCP callers and to call upstream.
      ORDER_ROUTER_API_KEY: "${ORDER_ROUTER_API_KEY:?set ORDER_ROUTER_API_KEY}"
      LOG_LEVEL: "info"
    depends_on:
      - order-router
    restart: unless-stopped
