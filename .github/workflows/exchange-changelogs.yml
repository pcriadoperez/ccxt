name: Exchange changelogs

# Daily collection of exchange API changelogs (exchange-changelogs/collector).
# Data is committed to the orphan branch "changelog-data" (never to master), then
# docs.ccxt.com/docs/changelog-exchanges is revalidated.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      venue:
        description: 'Comma-separated venue ids to collect (empty = all)'
        required: false
        default: ''
      dry_run:
        description: 'Collect and build the feed, but do not push data or revalidate the docs'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: exchange-changelogs
  cancel-in-progress: false

jobs:
  # Runs npm and the collector on fetched web content, so it only gets a read-only token. The data
  # it produces leaves this job as an artifact; nothing here can push.
  collect:
    if: github.repository == 'ccxt/ccxt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the changelog-data branch into exchange-changelogs/data
        run: |
          if git ls-remote --exit-code --heads origin changelog-data > /dev/null; then
            git fetch --no-tags --depth 1 origin +refs/heads/changelog-data:refs/remotes/origin/changelog-data
            git worktree add -B changelog-data exchange-changelogs/data origin/changelog-data
          else
            git worktree add --orphan -b changelog-data exchange-changelogs/data
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exchange-changelogs/collector/package-lock.json

      - name: Install collector
        working-directory: exchange-changelogs/collector
        run: npm ci

      - name: Collect and build feed
        working-directory: exchange-changelogs/collector
        env:
          VENUE: ${{ inputs.venue }}
        run: |
          if [ -n "$VENUE" ]; then
            npm run run -- --venue "$VENUE"
          else
            npm run run
          fi

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: changelog-data
          path: |
            exchange-changelogs/data
            !exchange-changelogs/data/.git
          if-no-files-found: error
          retention-days: 3

  # Holds the write token. Runs no npm and no repository code: it starts from an empty git repo,
  # so no hook or script from the collect job can reach the token.
  publish:
    needs: collect
    if: ${{ github.repository == 'ccxt/ccxt' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the changelog-data branch
        env:
          REPO: ${{ github.repository }}
        run: |
          git init -q data
          cd data
          git remote add origin "https://github.com/$REPO.git"
          if git ls-remote --exit-code --heads origin changelog-data > /dev/null; then
            git fetch -q --no-tags --depth 1 origin +refs/heads/changelog-data:refs/remotes/origin/changelog-data
            git checkout -q -B changelog-data origin/changelog-data
          else
            git checkout -q --orphan changelog-data
          fi
          # the artifact is the complete new tree
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: changelog-data
          path: data

      - name: Commit and push data
        working-directory: data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'no data changes'
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -q -m "[Automated changes] changelog data $(date -u +%Y-%m-%d)"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/changelog-data

      - name: Revalidate docs.ccxt.com
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.DOCS_REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo 'DOCS_REVALIDATE_SECRET not set, skipping'
            exit 0
          fi
          # the docs read the branch through raw.githubusercontent.com, which caches it for ~300 s:
          # revalidating right after the push would cache the previous latest.json for an hour
          sleep 330
          curl -fsS -X POST --max-time 30 -H "x-revalidate-secret: $REVALIDATE_SECRET" https://docs.ccxt.com/api/revalidate/changelog
          # revalidateTag is stale-while-revalidate: one request triggers the regeneration
          curl -fsS -o /dev/null --max-time 60 https://docs.ccxt.com/docs/changelog-exchanges
