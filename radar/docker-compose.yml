# CCXT Radar on one server. Usage (from this folder, with a filled-in .env):
#   docker compose up -d --build      start or update
#   docker compose logs -f            watch it
#   docker compose down               stop (data stays in the radar-data volume)
# Host in the EU or Asia: Binance and Bybit block US IP addresses.

services:
  radar:
    build: .
    image: ccxt-radar:local
    container_name: radar
    restart: unless-stopped
    init: true # forwards SIGTERM so the bot shuts down cleanly
    env_file: .env
    environment:
      RADAR_DB: /data/radar.sqlite
    volumes:
      - radar-data:/data
    healthcheck:
      # main.ts writes /data/heartbeat.json every minute
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/data/heartbeat.json');process.exit(Date.now()-s.mtimeMs<180000?0:1)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  radar-data:
